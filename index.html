<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Змейка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  h1 { font-size: 22px; margin-bottom: 10px; color: #4ecca3; }
  #score { font-size: 18px; margin-bottom: 12px; }
  canvas {
    background: #16213e;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
    max-width: 95vw;
    max-height: 60vh;
  }
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  #overlay h2 { color: #4ecca3; margin-bottom: 15px; font-size: 26px; }
  #overlay p { margin-bottom: 20px; font-size: 16px; color: #aaa; line-height: 1.5; }
  #overlay button {
    background: #4ecca3;
    color: #1a1a2e;
    border: none;
    padding: 14px 36px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
  }
  #overlay button:active { transform: scale(0.95); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h1>🐍 Змейка</h1>
  <div id="score">Счёт: 0</div>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <h2>Змейка</h2>
    <p>Управление: свайпы или стрелки.<br>Собирай яблоки и не врезайся!</p>
    <button id="startBtn">Играть</button>
  </div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

const GRID = 20;
let CELL = 20;
let COLS, ROWS;

function resize() {
  const maxW = Math.min(window.innerWidth * 0.95, 400);
  const maxH = Math.min(window.innerHeight * 0.6, 400);
  const size = Math.floor(Math.min(maxW, maxH) / GRID) * GRID;
  canvas.width = size;
  canvas.height = size;
  CELL = size / GRID;
  COLS = ROWS = GRID;
}

let snake, dir, nextDir, food, score, speed, timer, running;

function init() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  speed = 150;
  scoreEl.textContent = 'Счёт: 0';
  placeFood();
  running = true;
}

function placeFood() {
  while (true) {
    const f = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
    if (!snake.some(s => s.x === f.x && s.y === f.y)) {
      food = f;
      return;
    }
  }
}

function step() {
  if (!running) return;

  if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) dir = nextDir;

  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = 'Счёт: ' + score;
    placeFood();
    if (score % 5 === 0 && speed > 70) {
      speed -= 10;
      restartTimer();
    }
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.arc(
    food.x * CELL + CELL / 2,
    food.y * CELL + CELL / 2,
    CELL / 2 - 2,
    0, Math.PI * 2
  );
  ctx.fill();

  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4ecca3' : '#3ba88a';
    ctx.fillRect(
      s.x * CELL + 1,
      s.y * CELL + 1,
      CELL - 2,
      CELL - 2
    );
  });
}

function gameOver() {
  running = false;
  clearInterval(timer);
  if (tg) tg.HapticFeedback?.notificationOccurred('error');
  overlay.innerHTML = `
    <h2>Игра окончена</h2>
    <p>Твой счёт: <b style="color:#4ecca3">${score}</b></p>
    <button id="restartBtn">Ещё раз</button>
  `;
  overlay.classList.remove('hidden');
  document.getElementById('restartBtn').onclick = start;
}

function restartTimer() {
  clearInterval(timer);
  timer = setInterval(step, speed);
}

function start() {
  overlay.classList.add('hidden');
  resize();
  init();
  draw();
  restartTimer();
}

startBtn.onclick = start;

window.addEventListener('resize', () => {
  if (running) {
    resize();
    draw();
  }
});

// Клавиатура
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' && dir.y === 0) nextDir = {x: 0, y: -1};
  if (e.key === 'ArrowDown' && dir.y === 0) nextDir = {x: 0, y: 1};
  if (e.key === 'ArrowLeft' && dir.x === 0) nextDir = {x: -1, y: 0};
  if (e.key === 'ArrowRight' && dir.x === 0) nextDir = {x: 1, y: 0};
});

// Свайпы
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: true});

canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && dir.x === 0) nextDir = {x: 1, y: 0};
    else if (dx < 0 && dir.x === 0) nextDir = {x: -1, y: 0};
  } else {
    if (dy > 0 && dir.y === 0) nextDir = {x: 0, y: 1};
    else if (dy < 0 && dir.y === 0) nextDir = {x: 0, y: -1};
  }
}, {passive: true});

resize();
</script>
</body>
</html>
